name: 🚀 VideoPlanet 통합 배포

on:
  push:
    branches: [ main, recovery-20250731 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: '백엔드 배포'
        required: false
        default: 'true'
        type: boolean
      deploy_frontend:
        description: '프론트엔드 배포'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # 백엔드 테스트 및 배포
  backend:
    name: 🔧 백엔드 테스트 및 배포
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_backend != 'false'
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 의존성 설치
      run: |
        cd vridge_back
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🧪 테스트 실행
      run: |
        cd vridge_back
        python manage.py test --settings=config.settings_dev
      continue-on-error: true
      
    - name: 🚂 Railway 배포 트리거
      if: github.ref == 'refs/heads/recovery-20250731' || github.ref == 'refs/heads/main'
      run: |
        echo "✅ Railway가 자동으로 배포를 시작합니다"
        echo "📍 URL: https://videoplanet.up.railway.app"

  # 프론트엔드 빌드 및 배포
  frontend:
    name: 🎨 프론트엔드 빌드 및 배포
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_frontend != 'false'
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 📦 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: vridge_front/package-lock.json
        
    - name: 📦 의존성 설치
      run: |
        cd vridge_front
        npm ci --legacy-peer-deps
        
    - name: 🔨 프론트엔드 빌드
      run: |
        cd vridge_front
        npm run build
      env:
        NEXT_PUBLIC_API_URL: https://videoplanet.up.railway.app
        
    - name: 📊 빌드 결과 확인
      run: |
        cd vridge_front
        if [ -d ".next" ]; then
          echo "✅ 빌드 성공!"
          du -sh .next
        else
          echo "❌ 빌드 실패!"
          exit 1
        fi
        
    - name: 🚀 Vercel 배포
      if: github.ref == 'refs/heads/recovery-20250731' || github.ref == 'refs/heads/main'
      run: |
        cd vridge_front
        npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      continue-on-error: true

  # 통합 헬스체크
  health-check:
    name: 🩺 배포 상태 확인
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: ⏱️ 배포 대기 (5분)
      run: sleep 300
      
    - name: 🔍 백엔드 헬스체크
      run: |
        echo "🔍 백엔드 헬스체크 시작..."
        response=$(curl -s -o /dev/null -w "%{http_code}" https://videoplanet.up.railway.app/api/health/)
        if [ $response -eq 200 ]; then
          echo "✅ 백엔드 정상 작동 중"
        else
          echo "❌ 백엔드 응답 코드: $response"
        fi
        
    - name: 🔍 프론트엔드 헬스체크
      run: |
        echo "🔍 프론트엔드 헬스체크 시작..."
        response=$(curl -s -o /dev/null -w "%{http_code}" https://vlanet.net)
        if [ $response -eq 200 ] || [ $response -eq 304 ]; then
          echo "✅ 프론트엔드 정상 작동 중"
        else
          echo "⚠️ 프론트엔드 응답 코드: $response"
        fi
        
    - name: 📊 최종 배포 상태
      run: |
        echo "================================================"
        echo "📊 VideoPlanet 배포 상태"
        echo "================================================"
        echo "🔧 백엔드: https://videoplanet.up.railway.app"
        echo "🎨 프론트엔드: https://vlanet.net"
        echo "📅 배포 시간: $(date)"
        echo "================================================"

  # 성능 테스트 (선택사항)
  performance-test:
    name: ⚡ 성능 테스트
    runs-on: ubuntu-latest
    needs: health-check
    if: success()
    continue-on-error: true
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 📦 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: 🧪 안정성 테스트 실행
      run: |
        cd vridge_front/src/tests
        npm install axios
        node stability-100-test.js || true
        
    - name: 📈 Lighthouse 테스트
      run: |
        npm install -g @lhci/cli
        lhci autorun --collect.url=https://vlanet.net || true
      continue-on-error: true