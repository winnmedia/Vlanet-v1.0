name: Vercel Deploy (Corrected Path)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Project Structure
        run: |
          echo "Repository root contents:"
          ls -la
          echo ""
          echo "vridge_front contents:"
          ls -la vridge_front/
          echo ""
          echo "Verifying package.json location:"
          if [ -f "vridge_front/package.json" ]; then
            echo "✅ Found: vridge_front/package.json"
          else
            echo "❌ Not found: vridge_front/package.json"
            exit 1
          fi
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: vridge_front
          scope: ${{ secrets.VERCEL_ORG_ID }}