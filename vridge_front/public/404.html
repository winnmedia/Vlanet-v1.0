<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VideoPlanet</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // 404 오류 시 React 앱이 라우팅을 처리하도록 함
    // Vercel의 rewrite 규칙이 제대로 작동하지 않을 경우를 대비

    document.body.appendChild(script);
  </script>
