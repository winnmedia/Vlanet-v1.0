<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoPlanet 실시간 모니터링 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .status-bar {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.green {
            background: #10b981;
        }
        
        .status-indicator.yellow {
            background: #f59e0b;
        }
        
        .status-indicator.red {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .metric-title {
            font-size: 14px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 10px;
        }
        
        .metric-change {
            font-size: 14px;
            color: #6b7280;
        }
        
        .metric-change.positive {
            color: #10b981;
        }
        
        .metric-change.negative {
            color: #ef4444;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .chart-title {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .alerts-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 400px;
            overflow-y: auto;
        }
        
        .alert-item {
            padding: 12px;
            border-left: 4px solid;
            margin-bottom: 10px;
            border-radius: 4px;
            background: #f9fafb;
        }
        
        .alert-item.error {
            border-color: #ef4444;
            background: #fee;
        }
        
        .alert-item.warning {
            border-color: #f59e0b;
            background: #fef3c7;
        }
        
        .alert-item.info {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        
        .alert-time {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        
        .alert-message {
            font-size: 14px;
            color: #1f2937;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎬 VideoPlanet 실시간 모니터링</h1>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-indicator green" id="frontend-status"></div>
                    <span>Frontend</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator green" id="backend-status"></div>
                    <span>Backend</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator green" id="database-status"></div>
                    <span>Database</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator green" id="redis-status"></div>
                    <span>Redis</span>
                </div>
            </div>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">활성 사용자</span>
                    <span>👥</span>
                </div>
                <div class="metric-value" id="active-users">0</div>
                <div class="metric-change positive">+12% from last hour</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">API 응답 시간</span>
                    <span>⚡</span>
                </div>
                <div class="metric-value" id="api-response">0ms</div>
                <div class="metric-change positive">-5% from average</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">에러율</span>
                    <span>⚠️</span>
                </div>
                <div class="metric-value" id="error-rate">0%</div>
                <div class="metric-change positive">-2% from yesterday</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">CPU 사용률</span>
                    <span>💻</span>
                </div>
                <div class="metric-value" id="cpu-usage">0%</div>
                <div class="metric-change">Normal range</div>
            </div>
        </div>
        
        <div class="two-column">
            <div>
                <div class="chart-container">
                    <h3 class="chart-title">실시간 트래픽</h3>
                    <canvas id="traffic-chart"></canvas>
                </div>
                
                <div class="chart-container">
                    <h3 class="chart-title">API 엔드포인트 성능</h3>
                    <canvas id="api-chart"></canvas>
                </div>
            </div>
            
            <div>
                <div class="alerts-container">
                    <h3 class="chart-title">실시간 알림</h3>
                    <div id="alerts-list">
                        <!-- 알림이 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="dashboard.js"></script>
</body>
</html>
