<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>영상 협업 툴의 신세계 ㅣ 브이래닛 VLANET</title>
  <script>
    // 404 페이지 접근 시 즉시 홈으로 리다이렉트
    // 이는 Vercel의 rewrite가 작동하지 않을 경우의 폴백
    window.location.replace(window.location.origin + '/#' + window.location.pathname);
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px;">
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>잠시 후 홈페이지로 이동합니다...</p>
  </div>
</body>
</html>
