name: VideoPlanet CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - rollback

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.11'

jobs:
  # 코드 품질 검사
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vridge_front/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Frontend Lint
        run: |
          cd vridge_front
          npm ci
          npm run lint || true
          npm run format:check || true
      
      - name: Backend Lint
        run: |
          cd vridge_back
          pip install -r requirements.txt
          pip install black flake8 isort mypy
          black --check . || true
          flake8 . --exit-zero
          isort --check-only . || true
      
      - name: Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Frontend 테스트
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vridge_front/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd vridge_front
          npm ci
      
      - name: Run Unit Tests
        run: |
          cd vridge_front
          npm test -- --coverage --watchAll=false || true
      
      - name: Run E2E Tests
        run: |
          cd vridge_front
          npx playwright install chromium
          npm run test:e2e || true
      
      - name: Build Frontend
        run: |
          cd vridge_front
          npm run build
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: vridge_front/.next
          retention-days: 7
      
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/cms/projects
            http://localhost:3000/cms/feedback
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Backend 테스트
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videoplanet_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          cd vridge_back
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov
      
      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videoplanet_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd vridge_back
          python manage.py migrate
      
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videoplanet_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd vridge_back
          pytest --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./vridge_back/coverage.xml
          flags: backend
          name: backend-coverage

  # 통합 테스트
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videoplanet_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 10
      
      - name: Run Integration Tests
        run: |
          npm run test:integration
      
      - name: API Contract Tests
        run: |
          npm run test:api
      
      - name: Performance Tests
        run: |
          npm run test:performance

  # Staging 배포
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.vlanet.net
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Backend to Railway (Staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          npm install -g @railway/cli
          cd vridge_back
          railway up --environment staging
      
      - name: Deploy Frontend to Vercel (Staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd vridge_front
          vercel --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
      
      - name: Run Smoke Tests
        run: |
          npm run test:smoke -- --url=https://staging.vlanet.net
      
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Production 배포
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://vlanet.net
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release Tag
        run: |
          VERSION=$(cat VERSION)
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      
      - name: Backup Current Production
        run: |
          echo "Creating production backup..."
          # Railway 백업 스크립트 실행
      
      - name: Deploy Backend to Railway (Production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          npm install -g @railway/cli
          cd vridge_back
          railway up --environment production
      
      - name: Deploy Frontend to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd vridge_front
          vercel --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
      
      - name: Verify Deployment
        run: |
          npm run test:production -- --url=https://vlanet.net
      
      - name: Update Sentry Release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: videoplanet
        with:
          environment: production
          version: ${{ github.sha }}
      
      - name: Notify Team
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '🚀 Production deployment completed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  # Rollback 작업
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'rollback'
    environment:
      name: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Previous Release
        id: get_release
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^)
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
      
      - name: Checkout Previous Release
        run: |
          git checkout ${{ steps.get_release.outputs.previous_tag }}
      
      - name: Rollback Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          npm install -g @railway/cli
          cd vridge_back
          railway up --environment production
      
      - name: Rollback Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          cd vridge_front
          vercel rollback --token=$VERCEL_TOKEN
      
      - name: Notify Rollback
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '⚠️ Rollback to ${{ steps.get_release.outputs.previous_tag }} completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}