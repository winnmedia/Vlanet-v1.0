name: Vercel Working Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Check Token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ VERCEL_TOKEN is not set in GitHub Secrets!"
            echo "Please add VERCEL_TOKEN to your repository secrets:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: VERCEL_TOKEN"
            echo "4. Value: Your Vercel token from https://vercel.com/account/tokens"
            exit 1
          fi
          echo "✅ VERCEL_TOKEN is set"
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Deploy to Vercel
        run: |
          # 올바른 경로로 이동
          cd vridge_front
          
          # 현재 위치 확인
          echo "Current directory: $(pwd)"
          echo "Contents:"
          ls -la
          
          # Vercel 배포 실행
          vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}