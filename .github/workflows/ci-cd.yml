name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend 테스트 및 빌드
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vridge_front
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vridge_front/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint || true  # 초기에는 경고만
      
      - name: Run tests
        run: npm test -- --coverage --watchAll=false --passWithNoTests --forceExit
      
      - name: Build application
        run: npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./vridge_front/coverage
          flags: frontend
        continue-on-error: true

  # Backend 테스트
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vridge_back
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: QY7vEOjBYBjg0ITmtBbABrVGmBB6Of1_4CiRO_lMJkDVe8XlLpIcNAmJPuPUi402DqZ4_oX9musY6Emq
          DEBUG: false
        run: |
          python manage.py migrate
          pytest --cov=. --cov-report=xml --maxfail=5
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./vridge_back
          flags: backend
        continue-on-error: true

  # 보안 스캔
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Frontend 배포 (Vercel)
  deploy-frontend:
    needs: [frontend-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./vridge_front

  # Backend 배포 (Railway)
  deploy-backend:
    needs: [backend-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./vridge_back
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
        working-directory: .
      
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up

  # 배포 후 헬스체크
  post-deploy-check:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Wait for deployment
        run: sleep 60
      
      - name: Health check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://vlanet.net)
          if [ $response -eq 200 ]; then
            echo "Frontend is healthy"
          else
            echo "Frontend health check failed"
            exit 1
          fi
      
      - name: Health check - Backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://videoplanet.up.railway.app/health)
          if [ $response -eq 200 ]; then
            echo "Backend is healthy"
          else
            echo "Backend health check failed"
            exit 1
          fi
      
      - name: Send deployment notification
        if: success()
        run: |
          echo "Deployment successful! 🎉"
          # Slack/Discord 알림 추가 가능