name: Vercel Debug Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  debug-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check Environment
        run: |
          echo "=== Environment Check ==="
          echo "Current directory: $(pwd)"
          echo "Repository structure:"
          ls -la
          echo ""
          echo "=== vridge_front directory ==="
          ls -la vridge_front/ || echo "ERROR: vridge_front directory not found"
          echo ""
          echo "=== package.json location ==="
          find . -name "package.json" -path "*/vridge_front/*" -not -path "*/node_modules/*" | head -5
      
      - name: Check Secrets
        run: |
          echo "=== Checking Secrets ==="
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ ERROR: VERCEL_TOKEN is not set"
          else
            echo "✅ VERCEL_TOKEN is set"
          fi
          
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "❌ ERROR: VERCEL_ORG_ID is not set"
          else
            echo "✅ VERCEL_ORG_ID is set"
          fi
          
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ ERROR: VERCEL_PROJECT_ID is not set"
          else
            echo "✅ VERCEL_PROJECT_ID is set"
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Test Build Locally
        run: |
          echo "=== Testing build locally ==="
          cd vridge_front
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          echo ""
          echo "Building project..."
          npm run build
          echo ""
          echo "Build output:"
          ls -la .next/ || echo "ERROR: .next directory not created"
        env:
          NEXT_PUBLIC_API_URL: https://videoplanet.up.railway.app
          NEXT_PUBLIC_VERSION: 1.0.0
      
      - name: Try Vercel Deployment
        if: success()
        run: |
          echo "=== Attempting Vercel deployment ==="
          npm install -g vercel@latest
          cd vridge_front
          
          # Create a minimal vercel.json if needed
          if [ ! -f "vercel.json" ]; then
            echo "Creating vercel.json..."
            cat > vercel.json << 'EOF'
          {
            "buildCommand": "npm run build",
            "outputDirectory": ".next",
            "framework": "nextjs"
          }
          EOF
          fi
          
          # Try deployment with detailed output
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} || echo "Deployment failed with exit code: $?"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}