# VideoPlanet Nginx 설정 예시
# 프론트엔드와 백엔드를 하나의 도메인으로 서빙하는 경우

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name vlanet.net www.vlanet.net;
    
    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 나머지는 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 서버 블록
server {
    listen 443 ssl http2;
    server_name vlanet.net www.vlanet.net;
    
    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vlanet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlanet.net/privkey.pem;
    
    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    
    # CSP 헤더 (필요에 따라 조정)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://videoplanet.up.railway.app wss://videoplanet.up.railway.app;" always;
    
    # 파일 업로드 크기 제한
    client_max_body_size 500M;
    
    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;
    
    # 정적 파일 캐싱
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API 요청은 백엔드로 프록시
    location /api {
        proxy_pass https://videoplanet.up.railway.app;
        proxy_http_version 1.1;
        
        # 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 버퍼링 비활성화 (스트리밍용)
        proxy_buffering off;
    }
    
    # 웹소켓 지원
    location /ws {
        proxy_pass https://videoplanet.up.railway.app;
        proxy_http_version 1.1;
        
        # 웹소켓 업그레이드
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 (웹소켓은 길게 설정)
        proxy_read_timeout 86400;
    }
    
    # 미디어 파일
    location /media {
        # S3를 사용하는 경우
        proxy_pass https://videoplanet-media.s3.amazonaws.com;
        
        # 또는 백엔드에서 서빙하는 경우
        # proxy_pass https://videoplanet.up.railway.app;
        
        # 캐싱
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Django admin
    location /admin {
        proxy_pass https://videoplanet.up.railway.app;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 프론트엔드 (React)
    location / {
        # Vercel을 사용하는 경우
        proxy_pass https://vlanet-v1-0.vercel.app;
        
        # 또는 로컬에서 서빙하는 경우
        # root /var/www/vridge_front/build;
        # try_files $uri $uri/ /index.html;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 에러 페이지
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 로드 밸런싱 (선택사항)
upstream backend {
    least_conn;
    server videoplanet1.up.railway.app:443 weight=1;
    server videoplanet2.up.railway.app:443 weight=1 backup;
    
    # 헬스체크
    keepalive 32;
}

# Rate Limiting (선택사항)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

# API Rate Limiting 적용
location /api {
    limit_req zone=api burst=20 nodelay;
    # ... 기존 설정 ...
}

# 업로드 Rate Limiting 적용
location /api/feedbacks {
    limit_req zone=upload burst=5 nodelay;
    # ... 기존 설정 ...
}