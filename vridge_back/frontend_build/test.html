<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoPlanet 모바일 테스트</title>
</head>
<body>
    <h1>VideoPlanet 모바일 접속 테스트</h1>
    <p>이 페이지가 보인다면 프론트엔드 서버에 정상 접속된 것입니다.</p>
    
    <h2>현재 정보:</h2>
    <ul>
        <li>URL: <span id="url"></span></li>
        <li>호스트: <span id="host"></span></li>
        <li>프로토콜: <span id="protocol"></span></li>
        <li>User Agent: <span id="ua"></span></li>
        <li>화면 크기: <span id="screen"></span></li>
    </ul>
    
    <h2>API 테스트:</h2>
    <button onclick="testAPI()">API 테스트</button>
    <div id="api-result"></div>
    
    <script>
        document.getElementById('url').textContent = window.location.href;
        document.getElementById('host').textContent = window.location.host;
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('screen').textContent = `${window.screen.width} x ${window.screen.height}`;
        
        function testAPI() {
            fetch('https://videoplanet.up.railway.app/health/')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('api-result').innerHTML = 
                        '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                })
                .catch(err => {
                    document.getElementById('api-result').innerHTML = 
                        '<p style="color: red;">Error: ' + err.message + '</p>';
                });
        }
    </script>
</body>
</html>
