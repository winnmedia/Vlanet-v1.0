<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 생성 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .section h2 {
      margin-top: 0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #1631F8;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0F23C9;
    }
    .log {
      margin-top: 20px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
  </style>
</head>
<body>
  <h1>프로젝트 생성 페이지 테스트</h1>
  
  <div class="section">
    <h2>테스트 순서</h2>
    <ol>
      <li>브라우저에서 <a href="http://localhost:3000/ProjectCreate" target="_blank">프로젝트 생성 페이지</a> 열기</li>
      <li>개발자 도구 콘솔 열기 (F12)</li>
      <li>아래 버튼들을 순서대로 클릭하여 테스트 실행</li>
    </ol>
  </div>

  <div class="section">
    <h2>1. 페이지 상태 확인</h2>
    <button onclick="checkPageState()">페이지 상태 확인</button>
    <button onclick="simulateFormFill()">필수 필드 자동 입력</button>
  </div>

  <div class="section">
    <h2>2. 버튼 상태 확인</h2>
    <button onclick="checkButtonState()">등록 버튼 상태 확인</button>
    <button onclick="simulateButtonClick()">등록 버튼 클릭 시뮬레이션</button>
  </div>

  <div class="section">
    <h2>3. API 테스트</h2>
    <button onclick="testAPI()">API 직접 호출 테스트</button>
  </div>

  <div class="section">
    <h2>로그</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
    const log = (message, type = 'info') => {
      const logElement = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
      logElement.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
      logElement.scrollTop = logElement.scrollHeight;
    };

    const checkPageState = () => {
      log('=== 페이지 상태 확인 시작 ===');
      
      // React DevTools 확인
      if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
        log('✓ React DevTools 감지됨', 'success');
      } else {
        log('✗ React DevTools 없음', 'error');
      }
      
      // 입력 필드 확인
      const inputs = {
        name: document.querySelector('input[name="name"]'),
        description: document.querySelector('textarea[name="description"]'),
        manager: document.querySelector('input[name="manager"]'),
        consumer: document.querySelector('input[name="consumer"]')
      };
      
      Object.entries(inputs).forEach(([key, element]) => {
        if (element) {
          log(`✓ ${key} 필드: "${element.value || '(비어있음)'}"`, element.value ? 'success' : 'info');
        } else {
          log(`✗ ${key} 필드를 찾을 수 없음`, 'error');
        }
      });
      
      // 날짜 입력 필드 확인
      const dateInputs = document.querySelectorAll('.part.day input[type="date"], .date-picker-wrapper input');
      log(`날짜 입력 필드: ${dateInputs.length}개 발견`);
      
      // 등록 버튼 확인
      const submitButton = document.querySelector('.btn_wrap button.submit');
      if (submitButton) {
        log(`✓ 등록 버튼 발견: "${submitButton.textContent}"`, 'success');
        log(`  - disabled: ${submitButton.disabled}`);
        log(`  - className: ${submitButton.className}`);
      } else {
        log('✗ 등록 버튼을 찾을 수 없음', 'error');
      }
    };

    const simulateFormFill = () => {
      log('=== 필수 필드 자동 입력 시작 ===');
      
      const fillInput = (selector, value) => {
        const element = document.querySelector(selector);
        if (element) {
          // React의 onChange 이벤트를 트리거하기 위한 네이티브 이벤트
          const nativeInputValueSetter = Object.getOwnPropertyDescriptor(
            window.HTMLInputElement.prototype,
            'value'
          ).set;
          
          if (element.tagName === 'TEXTAREA') {
            const nativeTextareaValueSetter = Object.getOwnPropertyDescriptor(
              window.HTMLTextAreaElement.prototype,
              'value'
            ).set;
            nativeTextareaValueSetter.call(element, value);
          } else {
            nativeInputValueSetter.call(element, value);
          }
          
          const event = new Event('input', { bubbles: true });
          element.dispatchEvent(event);
          
          log(`✓ ${selector}: "${value}" 입력 완료`, 'success');
        } else {
          log(`✗ ${selector}를 찾을 수 없음`, 'error');
        }
      };
      
      fillInput('input[name="name"]', '테스트 프로젝트 ' + Date.now());
      fillInput('textarea[name="description"]', '테스트 프로젝트 설명입니다.');
      fillInput('input[name="manager"]', '테스트 담당자');
      fillInput('input[name="consumer"]', '테스트 의뢰처');
      
      setTimeout(() => {
        checkButtonState();
      }, 500);
    };

    const checkButtonState = () => {
      log('=== 등록 버튼 상태 확인 ===');
      
      const submitButton = document.querySelector('.btn_wrap button.submit');
      if (!submitButton) {
        log('✗ 등록 버튼을 찾을 수 없음', 'error');
        return;
      }
      
      log(`버튼 텍스트: "${submitButton.textContent}"`);
      log(`disabled: ${submitButton.disabled}`);
      log(`className: ${submitButton.className}`);
      
      const computedStyle = window.getComputedStyle(submitButton);
      log(`backgroundColor: ${computedStyle.backgroundColor}`);
      log(`cursor: ${computedStyle.cursor}`);
      log(`opacity: ${computedStyle.opacity}`);
      
      // 버튼에 연결된 이벤트 리스너 확인
      const events = getEventListeners ? getEventListeners(submitButton) : null;
      if (events) {
        log(`이벤트 리스너: ${JSON.stringify(Object.keys(events))}`);
      }
    };

    const simulateButtonClick = () => {
      log('=== 등록 버튼 클릭 시뮬레이션 ===');
      
      const submitButton = document.querySelector('.btn_wrap button.submit');
      if (!submitButton) {
        log('✗ 등록 버튼을 찾을 수 없음', 'error');
        return;
      }
      
      if (submitButton.disabled) {
        log('⚠️ 버튼이 비활성화되어 있습니다', 'error');
        log('필수 정보를 모두 입력했는지 확인하세요');
        return;
      }
      
      log('버튼 클릭 이벤트 발생...');
      submitButton.click();
      
      // 콘솔 로그 모니터링
      setTimeout(() => {
        log('콘솔에 출력된 로그를 확인하세요');
      }, 100);
    };

    const testAPI = async () => {
      log('=== API 직접 호출 테스트 ===');
      
      // 쿠키에서 토큰 가져오기
      const getCookie = (name) => {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) {
          return parts.pop().split(';').shift();
        }
        return null;
      };
      
      const token = getCookie('vridge_session') || localStorage.getItem('VGID');
      if (!token) {
        log('✗ 인증 토큰을 찾을 수 없음', 'error');
        log('먼저 로그인이 필요합니다');
        return;
      }
      
      log('✓ 토큰 발견', 'success');
      
      const testData = {
        name: '테스트 프로젝트 ' + Date.now(),
        manager: '테스트 담당자',
        consumer: '테스트 의뢰처',
        description: 'API 테스트 설명',
        color: '#1631F8',
        process: [
          {
            key: 'basic_plan',
            text: '기본 기획',
            startDate: '2025-08-02 09:00',
            endDate: '2025-08-03 18:00'
          }
        ]
      };
      
      log('요청 데이터:', 'info');
      log(JSON.stringify(testData, null, 2));
      
      try {
        const response = await fetch('https://videoplanet.up.railway.app/api/projects/create/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token.replace(/"/g, '')}`
          },
          credentials: 'include',
          body: JSON.stringify(testData)
        });
        
        log(`응답 상태: ${response.status} ${response.statusText}`);
        
        const data = await response.json();
        log('응답 데이터:', response.ok ? 'success' : 'error');
        log(JSON.stringify(data, null, 2));
        
      } catch (error) {
        log('✗ API 호출 오류: ' + error.message, 'error');
      }
    };
  </script>
</body>
</html>
