<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 - VideoPlanet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            width: 100%;
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        
        .offline-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .offline-message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .cached-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .cached-info h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .cached-info p {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.5;
        }
        
        .network-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        
        .online {
            background: rgba(76, 175, 80, 0.8) !important;
        }
        
        .offline {
            background: rgba(244, 67, 54, 0.8) !important;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="network-status offline" id="networkStatus">
        오프라인 상태
    </div>

    <div class="offline-container">
        <div class="offline-icon pulse">
            📡
        </div>
        
        <h1 class="offline-title">인터넷 연결이 끊어졌습니다</h1>
        
        <p class="offline-message">
            현재 인터넷에 연결되지 않았습니다.<br>
            연결이 복구되면 자동으로 최신 데이터를 불러옵니다.
        </p>
        
        <button class="retry-button" onclick="retryConnection()">
            다시 연결 시도
        </button>
        
        <div class="cached-info">
            <h3>🗂️ 캐시된 데이터 사용 가능</h3>
            <p>
                최근에 방문한 페이지와 프로젝트 정보는<br>
                오프라인 상태에서도 확인할 수 있습니다.
            </p>
        </div>
    </div>

    <script>
        // 네트워크 상태 모니터링
        function updateNetworkStatus() {
            const statusEl = document.getElementById('networkStatus');
            if (navigator.onLine) {
                statusEl.textContent = '온라인 상태';
                statusEl.className = 'network-status online';
                
                // 온라인 상태가 되면 자동으로 홈으로 이동
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                statusEl.textContent = '오프라인 상태';
                statusEl.className = 'network-status offline';
            }
        }
        
        // 연결 재시도
        function retryConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                // 강제로 네트워크 체크
                fetch('/api/health/', { 
                    method: 'GET',
                    cache: 'no-cache'
                })
                .then(() => {
                    window.location.href = '/';
                })
                .catch(() => {
                    alert('여전히 인터넷에 연결되지 않았습니다. 잠시 후 다시 시도해주세요.');
                });
            }
        }
        
        // 이벤트 리스너
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        // 초기 상태 설정
        updateNetworkStatus();
        
        // Service Worker와 통신
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(registration => {
                console.log('[Offline] Service Worker ready');
            });
            
            // Service Worker 메시지 수신
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data.type === 'NETWORK_ONLINE') {
                    updateNetworkStatus();
                }
            });
        }
        
        // 페이지 가시성 변경 시 네트워크 상태 체크
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateNetworkStatus();
            }
        });
    </script>
</body>
</html>
