<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피드백 페이지 스타일 테스트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        /* FeedbackButtons.scss 내용 */
        .feedback-button-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .feedback-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .feedback-button:hover {
            transform: translateY(-2px);
        }
        
        .feedback-button-primary {
            background: linear-gradient(135deg, #1631F8 0%, #0F23C9 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(22, 49, 248, 0.25);
        }
        
        .feedback-button-primary:hover {
            box-shadow: 0 6px 20px rgba(22, 49, 248, 0.4);
        }
        
        .feedback-button-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.25);
        }
        
        .feedback-button-danger:hover {
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
        }
        
        .feedback-upload-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #1631F8 0%, #0F23C9 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(22, 49, 248, 0.25);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .feedback-upload-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 49, 248, 0.4);
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .test-section {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <h1>피드백 페이지 스타일 테스트</h1>
    
    <div class="test-section">
        <h2>현재 적용된 스타일 (CSS 클래스 사용)</h2>
        <div class="feedback-button-container">
            <button class="feedback-button feedback-button-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>현재 시점에 피드백</span>
            </button>
            
            <button class="feedback-button feedback-button-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>AI 영상 피드백</span>
            </button>
            
            <div style="position: relative;">
                <input type="file" id="video-replace" class="visually-hidden" accept="video/*">
                <label for="video-replace" class="feedback-upload-label">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>영상 교체</span>
                </label>
            </div>
            
            <button class="feedback-button feedback-button-danger">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>영상 삭제</span>
            </button>
        </div>
    </div>
    
    <div class="test-section">
        <h2>스타일 확인 사항</h2>
        <ul>
            <li>✅ 모든 버튼이 파란색 (영상 삭제만 빨간색)</li>
            <li>✅ Hover 시 위로 살짝 올라가는 애니메이션</li>
            <li>✅ 그라데이션 배경색 적용</li>
            <li>✅ 그림자 효과</li>
            <li>✅ 버튼 간격 12px</li>
        </ul>
    </div>
</body>
</html>
